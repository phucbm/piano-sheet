<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Piano sheet player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="player.css">
<script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
<script src="player.js" defer></script>
</head>
<body data-tab="sheet">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><rect x="5" y="5" width="2.4" height="14" rx="1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.55.83L9.2 13.2a1.4 1.4 0 0 1 0-2.4l8.25-5.43A1 1 0 0 1 19 6.2Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><rect x="16.6" y="5" width="2.4" height="14" rx="1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83l8.25-5.43a1.4 1.4 0 0 0 0-2.4L6.55 5.37A1 1 0 0 0 5 6.2Z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 10.5 5-3v9l-5-3Z"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z"/><path d="m16 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-small" viewBox="0 0 24 24"><path d="M14 4v6h6M10 20v-6H4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
</svg>

<div id="app">
  <aside class="library" id="library" aria-label="Library">
    <div class="panel-head">
      <h2>Library</h2>
      <button class="glass icon lib-close" id="libClose" aria-label="Close library"><svg><use href="#i-close"/></svg></button>
    </div>
    <nav id="songs"></nav>
  </aside>

  <div class="phone-top" id="phoneTop">
    <button class="glass icon" id="collapse" aria-label="Close player"><svg><use href="#i-down"/></svg></button>
    <div class="tabs" role="tablist">
      <button class="glass pill" role="tab" data-tab="sheet">Sheet</button>
      <button class="glass pill" role="tab" data-tab="video">Video</button>
      <button class="glass pill" role="tab" data-tab="library">Library</button>
    </div>
  </div>

  <main class="sheet-pane">
    <header class="sheet-head">
      <button class="glass icon lib-open" id="libOpen" aria-label="Library"><svg><use href="#i-menu"/></svg></button>
      <div>
        <h1 id="title">Loading…</h1>
        <p id="meta"></p>
      </div>
    </header>
    <div class="scroller" id="scroller">
      <div class="paper" id="score"></div>
    </div>
    <button class="glass light pill back-pill" id="backToCurrent" hidden>Back to current</button>
  </main>

  <aside class="now" id="now" aria-label="Now playing">
    <div class="panel-head" id="nowHead">
      <h2>Now playing</h2>
      <button class="glass icon now-small" id="nowSmall" aria-label="Make smaller"><svg><use href="#i-small"/></svg></button>
      <button class="glass icon now-close" id="nowClose" aria-label="Close video"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="video-wrap">
      <video id="video" playsinline webkit-playsinline preload="auto" muted></video>
      <div class="no-video"><svg><use href="#i-note"/></svg></div>
    </div>
    <div class="now-body">
      <div class="versions" id="versions"></div>
      <p class="hint">Red = notes playing now. Tap a note to jump to it.<br>The sheet is auto-transcribed — trust your ears.</p>
    </div>
  </aside>

  <footer class="bar glass" id="bar">
    <div class="progress-line"><i id="progressLine"></i></div>
    <button class="np" id="np" aria-label="Open player">
      <span class="thumb"><img id="thumb" alt=""><svg><use href="#i-note"/></svg></span>
      <span class="np-text"><b id="npName"></b><small id="npSub"></small></span>
    </button>
    <div class="transport">
      <div class="buttons">
        <button class="glass icon" id="prevBar" aria-label="Back one bar" title="Back one bar (←)"><svg><use href="#i-prev"/></svg></button>
        <button class="glass icon play" id="play" aria-label="Play" title="Play / pause (Space)"><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg></button>
        <button class="glass icon" id="nextBar" aria-label="Forward one bar" title="Forward one bar (→)"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="seek">
        <span id="timeNow">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <span id="timeEnd">0:00</span>
      </div>
    </div>
    <div class="side">
      <div class="extras" id="extras">
        <div class="sheet-grip"></div>
        <div class="pick" data-pick="source">
          <span class="pick-label">Sound</span>
          <button class="glass pill pick-btn" aria-haspopup="menu" title="Sound"></button>
          <div class="pick-menu glass" role="menu">
            <button role="menuitemradio" data-v="sheet">Sheet</button>
            <button role="menuitemradio" data-v="original">Original</button>
            <button role="menuitemradio" data-v="both">Both</button>
          </div>
        </div>
        <div class="pick" data-pick="speed">
          <span class="pick-label">Speed</span>
          <button class="glass pill pick-btn" aria-haspopup="menu" title="Speed"></button>
          <div class="pick-menu glass" role="menu">
            <button role="menuitemradio" data-v="0.5">50%</button>
            <button role="menuitemradio" data-v="0.75">75%</button>
            <button role="menuitemradio" data-v="1">100%</button>
          </div>
        </div>
        <div class="pick" data-pick="names">
          <span class="pick-label">Note names</span>
          <button class="glass pill pick-btn" aria-haspopup="menu" title="Note names"></button>
          <div class="pick-menu glass" role="menu">
            <button role="menuitemradio" data-v="">Off</button>
            <button role="menuitemradio" data-v="letter">C D E</button>
            <button role="menuitemradio" data-v="solfege">Do Re Mi</button>
          </div>
        </div>
        <div class="volume">
          <span class="pick-label">Volume</span>
          <button class="glass icon" id="mute" aria-label="Mute"><svg class="i-volume"><use href="#i-volume"/></svg><svg class="i-mute"><use href="#i-mute"/></svg></button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
        <button class="glass icon" id="focusBtn" aria-label="Focus mode" title="Focus mode: hide the side panels"><svg><use href="#i-focus"/></svg></button>
      </div>
      <button class="glass icon" id="videoBtn" aria-label="Show video" title="Show / hide the video"><svg><use href="#i-video"/></svg></button>
      <button class="glass icon" id="moreBtn" aria-label="More options"><svg><use href="#i-more"/></svg></button>
    </div>
  </footer>
</div>
<div class="scrim" id="scrim"></div>
<midi-player id="player" sound-font hidden></midi-player>
</body>
</html>
