[project]
name = "piano-sheet"
version = "0.1.0"
description = "Turn a piano video or recording into a two-hand sheet and practise it in the browser"
authors = [
    { name = "phucbm", email = "hiphucbui@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "librosa>=0.11.0",
    "music21>=10.5.1",
    "piano-transcription-inference>=0.0.6",
    "pretty-midi>=0.2.11.post0",
    "torch>=2.14.1",
    "verovio>=6.3.0",
]

[project.scripts]
piano-sheet = "piano_sheet:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
